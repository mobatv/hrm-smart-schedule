<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Quản Lý Lịch Trực Thông Minh (HRM)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- SheetJS (Export Excel) & html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans transition-colors duration-200 h-full" x-data="hrmApp()" x-init="init()">
    <div class="min-h-full flex flex-col">
        
        <!-- HEADER -->
        <header class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-primary text-white p-2 rounded-lg font-bold text-xl">HRM</div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800 dark:text-white">Quản Lý Lịch Trực Nhân Sự</h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400" x-text="currentWeekText"></p>
                    </div>
                </div>

                <!-- Điều hướng tuần & Role -->
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex items-center bg-gray-100 dark:bg-gray-700 rounded-lg p-1">
                        <button @click="changeWeek(-1)" class="px-3 py-1 text-sm bg-white dark:bg-gray-600 rounded shadow hover:bg-gray-50 dark:text-white">&larr; Tuần trước</button>
                        <span class="px-4 text-sm font-semibold text-gray-700 dark:text-gray-200" x-text="currentWeekKey"></span>
                        <button @click="changeWeek(1)" class="px-3 py-1 text-sm bg-white dark:bg-gray-600 rounded shadow hover:bg-gray-50 dark:text-white">Tuần sau &rarr;</button>
                    </div>

                    <!-- Role Switcher -->
                    <select x-model="role" class="bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-sm rounded-lg px-3 py-2 border-0 focus:ring-2 focus:ring-primary">
                        <option value="admin">Quản Trị Viên (Admin)</option>
                        <option value="staff">Nhân Viên (Staff)</option>
                    </select>

                    <button @click="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                        <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                        <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </button>
                </div>
            </div>
            
            <!-- Tabs Navigation -->
            <div class="max-w-7xl mx-auto px-4 border-t border-gray-200 dark:border-gray-700 flex space-x-6">
                <button @click="activeTab = 'schedule'" :class="activeTab === 'schedule' ? 'border-primary text-primary font-bold' : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400'" class="py-3 border-b-2 text-sm transition-colors">Bảng Lịch Trực</button>
                <button @click="activeTab = 'timeline'" :class="activeTab === 'timeline' ? 'border-primary text-primary font-bold' : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400'" class="py-3 border-b-2 text-sm transition-colors">Timeline Trực</button>
                <button @click="activeTab = 'stats'" :class="activeTab === 'stats' ? 'border-primary text-primary font-bold' : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400'" class="py-3 border-b-2 text-sm transition-colors">Thống Kê Tháng</button>
                <button @click="activeTab = 'settings'" x-show="role === 'admin'" :class="activeTab === 'settings' ? 'border-primary text-primary font-bold' : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400'" class="py-3 border-b-2 text-sm transition-colors">Cấu Hình & Nhân Sự</button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full" x-cloak>
            
            <!-- TAB 1: BẢNG LỊCH TRỰC CHÍNH -->
            <div x-show="activeTab === 'schedule'" class="space-y-4">
                <!-- Toolbar các chức năng -->
                <div class="flex flex-wrap justify-between items-center gap-4 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-medium text-gray-600 dark:text-gray-300">Trạng thái tuần:</span>
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full" :class="isCurrentWeekLocked() ? 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400' : 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400'" x-text="isCurrentWeekLocked() ? 'Đã khóa lịch' : 'Đang mở chỉnh sửa'"></span>
                        
                        <button x-show="role === 'admin'" @click="toggleLockWeek()" class="ml-2 text-xs text-primary hover:underline" x-text="isCurrentWeekLocked() ? 'Mở khóa' : 'Khóa tuần này'"></button>
                    </div>

                    <div class="flex flex-wrap gap-2">
                        <button @click="exportExcel()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg shadow-sm transition-colors flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            Xuất Excel
                        </button>
                        <button @click="exportWord()" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg shadow-sm transition-colors flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            Xuất Word / PDF
                        </button>
                    </div>
                </div>

                <!-- Bảng Lịch Chính -->
                <div id="schedule-export-area" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700 text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider">
                                    <th class="p-3 border-r border-gray-200 dark:border-gray-700 w-40">Nhân sự</th>
                                    <template x-for="day in daysOfWeek" :key="day.key">
                                        <th class="p-3 border-r border-gray-200 dark:border-gray-700 text-center">
                                            <div x-text="day.name"></div>
                                            <div class="text-[10px] text-gray-400 font-normal" x-text="day.date"></div>
                                        </th>
                                    </template>
                                    <th class="p-3 text-center w-24">Tổng ca</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 dark:divide-gray-700 text-sm">
                                <template x-for="emp in employees" :key="emp.id">
                                    <tr class="hover:bg-gray-50/50 dark:hover:bg-gray-700/30">
                                        <!-- Tên nhân sự -->
                                        <td class="p-3 border-r border-gray-200 dark:border-gray-700 font-medium text-gray-800 dark:text-white flex items-center justify-between">
                                            <span x-text="emp.name"></span>
                                            <span class="text-xs px-1.5 py-0.5 bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 rounded" x-text="emp.role || 'Staff'"></span>
                                        </td>

                                        <!-- Các ngày trong tuần -->
                                        <template x-for="day in daysOfWeek" :key="day.key">
                                            <td class="p-2 border-r border-gray-200 dark:border-gray-700 align-top">
                                                <div class="space-y-1.5">
                                                    <!-- Ca sáng -->
                                                    <div class="flex items-center justify-between bg-gray-50 dark:bg-gray-700/50 p-1 rounded">
                                                        <span class="text-[10px] text-gray-500 dark:text-gray-400">Sáng</span>
                                                        <select x-model="emp.schedule[currentWeekKey][day.key].ca1" 
                                                                @change="saveToStorage()"
                                                                :disabled="isCurrentWeekLocked() && role === 'staff'"
                                                                class="text-xs bg-white dark:bg-gray-600 text-gray-800 dark:text-gray-200 rounded border-gray-300 dark:border-gray-500 py-0.5 px-1 focus:ring-1 focus:ring-primary">
                                                            <option value="">Trống</option>
                                                            <option value="HC">Hành chính</option>
                                                            <option value="S">Trực Sáng</option>
                                                            <option value="P">Phép</option>
                                                            <option value="N">Nghỉ</option>
                                                        </select>
                                                    </div>
                                                    <!-- Ca chiều -->
                                                    <div class="flex items-center justify-between bg-gray-50 dark:bg-gray-700/50 p-1 rounded">
                                                        <span class="text-[10px] text-gray-500 dark:text-gray-400">Chiều</span>
                                                        <select x-model="emp.schedule[currentWeekKey][day.key].ca2" 
                                                                @change="saveToStorage()"
                                                                :disabled="isCurrentWeekLocked() && role === 'staff'"
                                                                class="text-xs bg-white dark:bg-gray-600 text-gray-800 dark:text-gray-200 rounded border-gray-300 dark:border-gray-500 py-0.5 px-1 focus:ring-1 focus:ring-primary">
                                                            <option value="">Trống</option>
                                                            <option value="C">Trực Chiều</option>
                                                            <option value="T">Tăng ca</option>
                                                            <option value="N">Nghỉ</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </td>
                                        </template>

                                        <!-- Tổng ca trong tuần -->
                                        <td class="p-3 text-center font-bold text-primary" x-text="calculateTotalShifts(emp)"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB 2: TIMELINE TRỰC -->
            <div x-show="activeTab === 'timeline'" class="space-y-4">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4">Timeline Trực Theo Ngày (Tuần này)</h3>
                    <div class="space-y-6">
                        <template x-for="day in daysOfWeek" :key="day.key">
                            <div class="border-l-4 border-primary pl-4 py-2">
                                <h4 class="font-semibold text-gray-700 dark:text-gray-300 text-sm mb-2" x-text="day.name + ' (' + day.date + ')'"></h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="bg-gray-50 dark:bg-gray-700/40 p-3 rounded-lg">
                                        <span class="text-xs font-bold text-primary uppercase block mb-1">Ca Sáng</span>
                                        <div class="flex flex-wrap gap-1">
                                            <template x-for="emp in getEmployeesOnShift(day.key, 'ca1')" :key="emp.id">
                                                <span class="px-2 py-1 bg-white dark:bg-gray-600 shadow-xs rounded text-xs text-gray-800 dark:text-gray-200" x-text="emp.name + ' (' + emp.shiftType + ')'"></span>
                                            </template>
                                            <span x-show="getEmployeesOnShift(day.key, 'ca1').length === 0" class="text-xs text-gray-400 italic">Không có nhân sự trực</span>
                                        </div>
                                    </div>
                                    <div class="bg-gray-50 dark:bg-gray-700/40 p-3 rounded-lg">
                                        <span class="text-xs font-bold text-primary uppercase block mb-1">Ca Chiều</span>
                                        <div class="flex flex-wrap gap-1">
                                            <template x-for="emp in getEmployeesOnShift(day.key, 'ca2')" :key="emp.id">
                                                <span class="px-2 py-1 bg-white dark:bg-gray-600 shadow-xs rounded text-xs text-gray-800 dark:text-gray-200" x-text="emp.name + ' (' + emp.shiftType + ')'"></span>
                                            </template>
                                            <span x-show="getEmployeesOnShift(day.key, 'ca2').length === 0" class="text-xs text-gray-400 italic">Không có nhân sự trực</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- TAB 3: THỐNG KÊ THÁNG -->
            <div x-show="activeTab === 'stats'" class="space-y-4">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold text-gray-800 dark:text-white">Thống Kê Tổng Hợp Ca Trực Tháng</h3>
                        <input type="month" x-model="selectedMonth" class="bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-sm rounded-lg px-3 py-2 border-0">
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700 text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase">
                                    <th class="p-3">Nhân sự</th>
                                    <th class="p-3 text-center">Tổng ca trực</th>
                                    <th class="p-3 text-center">Ca Hành Chính</th>
                                    <th class="p-3 text-center">Ca Sáng</th>
                                    <th class="p-3 text-center">Ca Chiều</th>
                                    <th class="p-3 text-center">Tăng ca</th>
                                    <th class="p-3 text-center">Nghỉ phép</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 dark:divide-gray-700 text-sm">
                                <template x-for="emp in employees" :key="emp.id">
                                    <tr>
                                        <td class="p-3 font-medium text-gray-800 dark:text-white" x-text="emp.name"></td>
                                        <td class="p-3 text-center font-bold text-primary" x-text="getMonthStats(emp).total"></td>
                                        <td class="p-3 text-center text-gray-600 dark:text-gray-300" x-text="getMonthStats(emp).hc"></td>
                                        <td class="p-3 text-center text-gray-600 dark:text-gray-300" x-text="getMonthStats(emp).s"></td>
                                        <td class="p-3 text-center text-gray-600 dark:text-gray-300" x-text="getMonthStats(emp).c"></td>
                                        <td class="p-3 text-center text-gray-600 dark:text-gray-300" x-text="getMonthStats(emp).t"></td>
                                        <td class="p-3 text-center text-gray-600 dark:text-gray-300" x-text="getMonthStats(emp).p"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB 4: CẤU HÌNH & NHÂN SỰ (ADMIN) -->
            <div x-show="activeTab === 'settings'" class="space-y-4">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4">Quản Lý Danh Sách Nhân Sự</h3>
                    
                    <!-- Thêm nhân sự mới -->
                    <div class="flex gap-2 mb-6">
                        <input type="text" x-model="newEmpName" placeholder="Họ và tên nhân sự mới..." class="flex-1 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-sm rounded-lg px-4 py-2 border border-gray-300 dark:border-gray-600">
                        <button @click="addEmployee()" class="px-4 py-2 bg-primary hover:bg-blue-600 text-white text-sm font-medium rounded-lg shadow-sm">Thêm nhân sự</button>
                    </div>

                    <!-- Danh sách nhân sự -->
                    <div class="divide-y divide-gray-200 dark:divide-gray-700">
                        <template x-for="(emp, index) in employees" :key="emp.id">
                            <div class="py-3 flex items-center justify-between">
                                <span class="font-medium text-gray-800 dark:text-white" x-text="emp.name"></span>
                                <button @click="removeEmployee(emp.id)" class="text-sm text-red-600 hover:text-red-800">Xóa</button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- LOGIC SCRIPT KẾT NỐI DB & TOÀN BỘ TÍNH NĂNG -->
    <script>
        function getDefaultWeekSchedule() {
            return {
                t2: { ca1: '', ca2: '' },
                t3: { ca1: '', ca2: '' },
                t4: { ca1: '', ca2: '' },
                t5: { ca1: '', ca2: '' },
                t6: { ca1: '', ca2: '' },
                t7: { ca1: '', ca2: '' },
                cn: { ca1: '', ca2: '' }
            };
        }

        function hrmApp() {
            return {
                activeTab: 'schedule',
                role: 'admin',
                darkMode: false,
                currentWeekKey: '2026-W35',
                currentWeekText: 'Tuần từ 24/08/2026 đến 30/08/2026',
                selectedMonth: '2026-08',
                newEmpName: '',
                lockedWeeks: JSON.parse(localStorage.getItem('hrm_locked_weeks') || '{}'),
                
                employees: [],

                init() {
                    // Kiểm tra theme sáng/tối
                    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        this.darkMode = true;
                        document.documentElement.classList.add('dark');
                    }

                    // KẾT NỐI DATABASE THẬT (Thay link Northflank của bạn vào đây nếu cần)
                    fetch('https://[LINK_NORTHFLANK_CUA_BAN]/api/schedules')
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.length > 0) {
                                this.employees = data;
                            } else {
                                this.loadDefaultEmployees();
                            }
                        })
                        .catch(err => {
                            console.error('Lỗi kết nối Backend, tải dữ liệu LocalStorage dự phòng:', err);
                            const localData = localStorage.getItem('hrm_smart_schedule');
                            if (localData) {
                                this.employees = JSON.parse(localData);
                            } else {
                                this.loadDefaultEmployees();
                            }
                        });
                },

                loadDefaultEmployees() {
                    this.employees = [
                        { id: 1, name: 'Ngọc Hào', role: 'Leader', schedule: { [this.currentWeekKey]: getDefaultWeekSchedule() } },
                        { id: 2, name: 'Anh Bình', role: 'Staff', schedule: { [this.currentWeekKey]: getDefaultWeekSchedule() } },
                        { id: 3, name: 'Minh Tuấn', role: 'Staff', schedule: { [this.currentWeekKey]: getDefaultWeekSchedule() } }
                    ];
                },

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                    }
                },

                daysOfWeek: [
                    { key: 't2', name: 'Thứ 2', date: '24/08' },
                    { key: 't3', name: 'Thứ 3', date: '25/08' },
                    { key: 't4', name: 'Thứ 4', date: '26/08' },
                    { key: 't5', name: 'Thứ 5', date: '27/08' },
                    { key: 't6', name: 'Thứ 6', date: '28/08' },
                    { key: 't7', name: 'Thứ 7', date: '29/08' },
                    { key: 'cn', name: 'Chủ Nhật', date: '30/08' }
                ],

                changeWeek(direction) {
                    // Logic chuyển tuần đơn giản mẫu
                    if (direction > 0) {
                        this.currentWeekKey = '2026-W36';
                        this.currentWeekText = 'Tuần từ 31/08/2026 đến 06/09/2026';
                    } else {
                        this.currentWeekKey = '2026-W35';
                        this.currentWeekText = 'Tuần từ 24/08/2026 đến 30/08/2026';
                    }
                    // Khởi tạo tuần mới cho nhân sự nếu chưa có
                    this.employees.forEach(emp => {
                        if (!emp.schedule) emp.schedule = {};
                        if (!emp.schedule[this.currentWeekKey]) {
                            emp.schedule[this.currentWeekKey] = getDefaultWeekSchedule();
                        }
                    });
                },

                isCurrentWeekLocked() {
                    return !!this.lockedWeeks[this.currentWeekKey];
                },

                toggleLockWeek() {
                    if (this.role !== 'admin') return;
                    this.lockedWeeks[this.currentWeekKey] = !this.lockedWeeks[this.currentWeekKey];
                    localStorage.setItem('hrm_locked_weeks', JSON.stringify(this.lockedWeeks));
                },

                saveToStorage() {
                    if (this.isCurrentWeekLocked() && this.role === 'staff') {
                        alert('Tuần này đã bị khóa, bạn không thể thay đổi lịch.');
                        return;
                    }
                    
                    // 1. Lưu LocalStorage dự phòng
                    localStorage.setItem('hrm_smart_schedule', JSON.stringify(this.employees));

                    // 2. Gửi dữ liệu cập nhật lên Backend / Database thật
                    fetch('https://[LINK_NORTHFLANK_CUA_BAN]/api/schedules', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.employees)
                    }).catch(err => console.error('Lỗi đồng bộ Database:', err));
                },

                calculateTotalShifts(emp) {
                    if (!emp.schedule || !emp.schedule[this.currentWeekKey]) return 0;
                    let count = 0;
                    const week = emp.schedule[this.currentWeekKey];
                    for (let day in week) {
                        if (week[day].ca1 && week[day].ca1 !== 'N' && week[day].ca1 !== 'P') count++;
                        if (week[day].ca2 && week[day].ca2 !== 'N' && week[day].ca2 !== 'P') count++;
                    }
                    return count;
                },

                getEmployeesOnShift(dayKey, shiftName) {
                    let result = [];
                    this.employees.forEach(emp => {
                        if (emp.schedule && emp.schedule[this.currentWeekKey]) {
                            const val = emp.schedule[this.currentWeekKey][dayKey][shiftName];
                            if (val && val !== 'N') {
                                result.push({ id: emp.id, name: emp.name, shiftType: val });
                            }
                        }
                    });
                    return result;
                },

                getMonthStats(emp) {
                    let stats = { total: 0, hc: 0, s: 0, c: 0, t: 0, p: 0 };
                    if (!emp.schedule) return stats;
                    
                    Object.keys(emp.schedule).forEach(weekKey => {
                        const week = emp.schedule[weekKey];
                        Object.keys(week).forEach(dayKey => {
                            ['ca1', 'ca2'].forEach(c => {
                                const val = week[dayKey][c];
                                if (val === 'HC') { stats.hc++; stats.total++; }
                                if (val === 'S') { stats.s++; stats.total++; }
                                if (val === 'C') { stats.c++; stats.total++; }
                                if (val === 'T') { stats.t++; stats.total++; }
                                if (val === 'P') { stats.p++; }
                            });
                        });
                    });
                    return stats;
                },

                addEmployee() {
                    if (!this.newEmpName.trim()) return;
                    const newId = this.employees.length > 0 ? Math.max(...this.employees.map(e => e.id)) + 1 : 1;
                    this.employees.push({
                        id: newId,
                        name: this.newEmpName.trim(),
                        role: 'Staff',
                        schedule: { [this.currentWeekKey]: getDefaultWeekSchedule() }
                    });
                    this.newEmpName = '';
                    this.saveToStorage();
                },

                removeEmployee(id) {
                    if (confirm('Bạn có chắc muốn xóa nhân sự này?')) {
                        this.employees = this.employees.filter(e => e.id !== id);
                        this.saveToStorage();
                    }
                },

                exportExcel() {
                    let table = document.querySelector("#schedule-export-area table");
                    let wb = XLSX.utils.table_to_book(table, {sheet: "LichTruc"});
                    XLSX.writeFile(wb, `LichTruc_${this.currentWeekKey}.xlsx`);
                },

                exportWord() {
                    const element = document.getElementById('schedule-export-area');
                    let opt = {
                        margin:       10,
                        filename:     `LichTruc_${this.currentWeekKey}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2 },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
                    };
                    html2pdf().from(element).set(opt).save();
                }
            }
        }
    </script>
</body>
</html>
